# 无机化学实验网站 —— Nginx 站点配置示例
# 放到服务器 /etc/nginx/sites-available/chemlab 并符号链接到 sites-enabled。
# 站点目录默认 /var/www/chemlab；若你用别的路径，同步改下面的 root 与 setup-server.sh。

server {
    listen 8080;
    # 没有域名时去掉下面 server_name 行即可，用 http://<服务器IP>:8080 访问；
    # 有域名则把 example 换成你的域名，并视需要配置 443/HTTPS。
    server_name _;

    # 构建产物 dist/ 上传到此目录
    root /var/www/chemlab;
    index index.html;

    # 静态资源缓存（assets 有内容哈希，可长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router 使用 history 模式：前端路由（/experiments/:id 等）
    # 必须回退到 index.html，否则刷新/直达二级路径会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 基本安全与压缩
    add_header X-Content-Type-Options nosniff;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
