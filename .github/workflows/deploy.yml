# ============================================================================
# CI/CD 流程：推送到 main 分支后，GitHub Actions 构建 dist/ 并上传为 Artifact。
# 由于校园云服务器可能限制海外 IP 访问，部署改为以下方式之一：
#   1) 本地手动部署：下载 Artifact 后 bash deploy/deploy.sh
#   2) 本地直接构建：npm run build && bash deploy/deploy.sh
#   3) 若服务器可从 GitHub runner 访问，也可在 workflow 中直接 rsync
# ============================================================================
name: Build & Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
